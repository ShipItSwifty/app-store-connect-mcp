name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: swift-format lint (strict)
        run: |
          xcrun swift-format lint --recursive --strict \
            --configuration .swift-format \
            Sources Tests

  macos:
    name: Build & Test (macOS)
    needs: lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage --no-parallel

      - name: Smoke test MCP binary
        run: |
          swift build --product app-store-connect-mcp
          # No credentials: the process should start its stdio loop, so we just
          # confirm the binary launches and does not exit immediately.
          BIN=$(swift build --product app-store-connect-mcp --show-bin-path)/app-store-connect-mcp
          "$BIN" < /dev/null & PID=$!
          sleep 2
          kill "$PID"

  linux:
    name: Build & Test (Linux)
    needs: lint
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (AppStoreConnectKit + MCP server)
        run: |
          swift build --product AppStoreConnectKit
          swift build --product app-store-connect-mcp

      - name: Test
        run: swift test --enable-code-coverage --no-parallel
